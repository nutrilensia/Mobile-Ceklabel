name: cek_label
description: "CekLabel - Scan & analyze food nutrition labels"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  camera: ^0.12.0
  image_picker: ^1.1.2
  dio: ^5.7.0
  google_fonts: ^6.2.1
  permission_handler: ^11.3.1
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.5.5
  smooth_page_indicator: ^2.0.1
  lottie: ^3.3.3
  google_nav_bar: ^5.0.6
  pdf: ^3.11.2
  printing: ^5.13.2
  flutter_image_compress: ^2.5.0
  provider: ^6.1.5+1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo_padded.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo_padded.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/

